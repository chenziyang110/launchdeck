spring.application.name=spring-boot-orders
server.address=127.0.0.1
server.port=${PORT:8107}

spring.datasource.url=jdbc:h2:file:${ORDERS_DB_PATH:./data/orders};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

orders.seed-path=${ORDERS_SEED_PATH:data/seed.json}
spring.jackson.serialization.write-dates-as-timestamps=false
