name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Lifecycle smoke
        run: node scripts/smoke-lifecycle.js --mode quick --json

  gallery:
    name: Gallery compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      LAUNCHDECK_GALLERY_LIVE: "1"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        shell: pwsh
        run: |
          python -m pip install --user poetry
          $userBase = python -m site --user-base
          "$userBase\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$userBase/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: npm ci

      - name: Start Docker Engine on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $service = Get-Service -Name docker -ErrorAction SilentlyContinue
          if (-not $service) {
            $service = Get-Service -Name com.docker.service -ErrorAction SilentlyContinue
          }
          if ($service -and $service.Status -ne 'Running') {
            try {
              Start-Service -Name $service.Name
            } catch {
              Write-Warning "Unable to start Docker service '$($service.Name)': $($_.Exception.Message)"
            }
          } elseif (-not $service) {
            Write-Warning 'No Docker service was found on this Windows runner.'
          }

          $deadline = (Get-Date).AddMinutes(2)
          do {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Docker Engine is ready.'
              exit 0
            }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          Write-Warning 'Docker Engine did not become ready before the deadline.'

      - name: Verify Docker and Docker Compose prerequisites
        run: |
          docker version
          docker info
          docker compose version

      - name: Pre-pull Windows Docker base image
        if: runner.os == 'Windows'
        shell: pwsh
        run: docker pull mcr.microsoft.com/windows/servercore:ltsc2025

      - name: Run native gallery matrix
        run: node --test --test-concurrency=1 test/gallery-native-matrix.test.js

      - name: Run Launchdeck gallery matrix
        run: node --test --test-concurrency=1 test/gallery-launchdeck-matrix.test.js

  package:
    name: Package and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify package contents
        run: npm run package:check
